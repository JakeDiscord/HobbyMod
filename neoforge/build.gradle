plugins { id 'com.github.johnrengelman.shadow' version '8.1.1' }

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url = 'https://maven.ryanhcode.dev/releases'; content { includeGroup 'dev.ryanhcode.sable-companion' } }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    // The universal handbook is data-driven; shared gameplay needs no Patchouli classes.
    modRuntimeOnly "vazkii.patchouli:Patchouli:${rootProject.patchouli_version}"
    // Compile against the recommended API, without making Sable mandatory or bundling its physics engine.
    modCompileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    // Patchouli discovers book definitions in the owning mod's resource roots.
    // Loom loads common as a separate generated mod during development, so copy
    // the portable definition into NeoForge's resources for normal run tasks.
    from(project(':common').file('src/main/resources')) {
        include 'data/hobbymod/patchouli_books/**/book.json'
    }
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json'
    exclude 'fabric.mod.json'
    filesMatching('data/hobbymod/patchouli_books/**/book.json') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}
jar { archiveClassifier = 'dev' }

sourcesJar {
    def commonSources = project(':common').tasks.named('sourcesJar')
    dependsOn commonSources
    from(commonSources.map { zipTree(it.archiveFile.get().asFile) })
}

components.java {
    withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
}

// Include integration tests only in explicit development test runs.
if (project.hasProperty('gametest')) {
    sourceSets.main.java.srcDir('src/gametest/java')
    sourceSets.main.resources.srcDir('src/gametest/resources')
    loom.runs.server {
        property 'neoforge.enabledGameTestNamespaces', 'hobbymod'
    }
}
