plugins { id 'com.github.johnrengelman.shadow' version '8.1.1' }

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json'
    exclude 'fabric.mod.json'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}
jar { archiveClassifier = 'dev' }

sourcesJar {
    def commonSources = project(':common').tasks.named('sourcesJar')
    dependsOn commonSources
    from(commonSources.map { zipTree(it.archiveFile.get().asFile) })
}

components.java {
    withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
}

// Include integration tests only in explicit development test runs.
if (project.hasProperty('gametest')) {
    sourceSets.main.java.srcDir('src/gametest/java')
    sourceSets.main.resources.srcDir('src/gametest/resources')
    loom.runs.server {
        property 'neoforge.enabledGameTestNamespaces', 'hobbymod'
    }
}
